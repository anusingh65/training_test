name: pharmachain_mobile
description: PharmaChain - Pharmaceutical Supply Chain Verification

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Supabase
  supabase_flutter: ^2.5.0

  # QR scanning
  mobile_scanner: ^5.1.0

  # Blockchain
  web3dart: ^2.7.0
  http: ^1.2.0

  # Location
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Storage
  flutter_secure_storage: ^9.2.0

  # UI
  google_fonts: ^6.2.0
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Crypto
  crypto: ^3.0.3
  convert: ^3.1.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/abi/
